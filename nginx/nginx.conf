upstream fastapi_app {
    server app:8000;
}

##
## HTTP (80): только редирект на HTTPS + обработка ACME-челленджей
##
server {
    listen 80;
    listen [::]:80;

    server_name your-domain.com www.your-domain.com;

    # Путь, который использует certbot в режиме webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Всё остальное — редирект на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

    access_log /var/log/nginx/siteTime_access.log;
    error_log  /var/log/nginx/siteTime_error.log;
}

##
## HTTPS (443): основной сервер
##
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name your-domain.com www.your-domain.com;

    # Путь к сертификатам, которые создаст certbot
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/your-domain.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Проксируем весь HTTPS-трафик в FastAPI
    location / {
        proxy_pass         http://fastapi_app;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    access_log /var/log/nginx/siteTime_access.log;
    error_log  /var/log/nginx/siteTime_error.log;
}


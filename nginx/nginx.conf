upstream fastapi_app {
    server app:8000;
}

server {
    listen 80;
    listen [::]:80;

    server_name your-domain.com www.your-domain.com;

    # Если захочешь вынести статику в nginx, можно раскомментировать и настроить root
    # root /var/www/siteTime;

    # Проксируем весь HTTP-трафик в FastAPI
    location / {
        proxy_pass         http://fastapi_app;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    access_log /var/log/nginx/siteTime_access.log;
    error_log  /var/log/nginx/siteTime_error.log;
}



networks:
  gamba:

services:
  db:
    image: postgres:15
    env_file: .env
    container_name: gamba_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./db/insert.sql:/docker-entrypoint-initdb.d/02_inserts.sql
      - ./db/03_init_test_db.sh:/docker-entrypoint-initdb.d/03_init_test_db.sh
    ports:
      - "5432:5432"
    networks:
      - gamba

  pgadmin:
    image: dpage/pgadmin4
    env_file: .env
    container_name: gamba_pg
    depends_on:
      - db
    ports:
      - "5050:80"
    networks:
      - gamba

  app:
    build: ./app
    env_file: .env
    container_name: gamba_web
    depends_on:
      - db
    ports:
      - "8000:8000"
    networks:
      - gamba

  nginx:
    image: nginx:1.27-alpine
    container_name: gamba_nginx
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    networks:
      - gamba

  certbot:
    image: certbot/certbot:latest
    container_name: gamba_certbot
    depends_on:
      - nginx
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    # будем запускать команды вручную через `docker compose run`
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do sleep 3600; done"

volumes:
  postgres_data:
  certbot-etc:
  certbot-var:
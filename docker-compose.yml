networks:
  gamba:

services:
  db:
    image: postgres:15
    env_file: .env
    container_name: gamba_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./db/insert.sql:/docker-entrypoint-initdb.d/02_inserts.sql
      - ./db/03_init_test_db.sh:/docker-entrypoint-initdb.d/03_init_test_db.sh
      - ./db/migrations:/docker-entrypoint-initdb.d/migrations
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-lab}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gamba

  pgadmin:
    image: dpage/pgadmin4
    env_file: .env
    container_name: gamba_pg
    depends_on:
      - db
    ports:
      - "127.0.0.1:5050:80"
    networks:
      - gamba

  app:
    build: ./app
    env_file: .env
    container_name: gamba_web
    depends_on:
      - db
    ports:
      - "8000:8000"
    networks:
      - gamba

  polymarket_sync:
    build: ./app
    env_file: .env
    container_name: gamba_polymarket_sync
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
    command: python -u services/polymarket_sync.py --daemon --interval 3600 --target 10
    restart: unless-stopped
    networks:
      - gamba

